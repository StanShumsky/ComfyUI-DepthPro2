[project]
name = "comfyui-depthpro2"
description = "Apple Depth Pro 2 metric monocular depth nodes: custom loader with bf16/fp16/fp8 weights, per-image and temporally consistent video depth."
version = "0.2.0"
license = { file = "LICENSE" }
dependencies = ["timm>=1.0.27,<1.1", "huggingface_hub>=1.0", "safetensors"]
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: Apple Metal",
]

[project.urls]
Repository = "https://github.com/StanShumsky/ComfyUI-DepthPro2"

[tool.comfy]
PublisherId = "shumsky"
DisplayName = "ComfyUI-DepthPro2"
Icon = "https://raw.githubusercontent.com/StanShumsky/ComfyUI-DepthPro2/main/icon.png"

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: prepend mode imports the repo-root ComfyUI __init__.py as a test module.
addopts = "--import-mode=importlib"
markers = ["integration: loads real weights; opt in with RUN_DP2_WEIGHT_TESTS=1"]