name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      # Tags are not a pyproject field; the registry only accepts them via this API.
      - name: Sync registry tags
        run: |
          curl -sf -X PUT "https://api.comfy.org/publishers/shumsky/nodes/comfyui-depthpro2" \
            -H "Authorization: Bearer $REGISTRY_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"tags": ["depth", "depth-estimation", "metric-depth", "video"]}'
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}